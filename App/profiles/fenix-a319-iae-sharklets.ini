# Fenix A319, IAE V2500 engines, sharklets.
# Nose gear and APU: guess: A320 minus 2.13 m forward and 1.60 m aft. Engines, main gear and wings are the same on all three.
# IAE: the V2500's longer intake and long-duct nozzle move the intake effects 0.35 m forward and the exhaust ones 0.6 m back (a guess).
# Check with the markers and save a corrected copy with 'New profile for this aircraft'.
[profile]
name=Fenix A319 · IAE · sharklets
match=FenixA319 & IAE & SL
match=Fenix A319 & IAE & SL

[globals]
engine_x=-5.75
engine_y=-1.6
engine_z=0.0
main_gear_x=-3.8
main_gear_z=-3.9
nose_gear_z=6.5
ground_y=-2.9
var6=L:A320_Sound:ENG_1_N1, Number

[replace]

[effect.wingtip_vortex]
offset=17.5 4.6 -9.4

[effect.wingtip_vortex_near]
offset=17.5 4.6 -9.4

[effect.apu_steam]
offset=0 1.2 -17.73

[effect.intake_condensation]
offset=0 0.35 2.15

[effect.intake_fog]
offset=0 0.4 1.95

[effect.intake_swirl]
offset=0 -1.25 2.95

[effect.snow_intake_vortex]
offset=0 -1.3 2.95

[effect.exhaust_steam]
offset=0 0 -4.1

[effect.heat_haze]
offset=0 0 -3.6

[effect.heat_haze_asobo]
offset=0 0 -3.6

[effect.engine_start_puff]
offset=0 -0.2 -3.8
