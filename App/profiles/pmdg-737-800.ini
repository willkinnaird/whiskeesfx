# PMDG 737-800: educated guess from published dimensions (span 35.8 m with winglets, wheelbase 15.6 m, CFM56-7 4.9 m out, gear track 5.7 m).
# Origin assumed level with the engine fan like the Fenix model; check with the position markers and save a
# corrected copy with 'New profile for this aircraft'. Effects read the sim's standard N1.
[profile]
name=PMDG 737-800
match=PMDG & 737-800
match=PMDG & 737-8

[globals]
engine_x=-4.9
engine_y=-1.4
engine_z=0.0
main_gear_x=-2.86
main_gear_z=-4.2
nose_gear_z=11.4
ground_y=-2.6
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)

[effect.wingtip_vortex]
offset=17.9 2.8 -9.0

[effect.wingtip_vortex_near]
offset=17.9 2.8 -9.0

[effect.flap_vortex]
offset=12.8 0.9 -6.5

[effect.flap_vortex_near]
offset=12.8 0.9 -6.5

[effect.apu_steam]
offset=0 1.0 -19.5
