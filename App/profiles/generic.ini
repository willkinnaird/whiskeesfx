# Any aircraft without its own profile. Effects read the sim's standard N1 instead of the Fenix's own.
# Positions are the A321's: use the markers and "New profile for this aircraft" to fit another aircraft.
[profile]
name=Generic aircraft
generic=1

[globals]
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)
(L:A320_Sound:ENG_1_N1, Number) => (A:TURB ENG N1:1, Percent)
