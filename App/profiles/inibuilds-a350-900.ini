# iniBuilds A350-900: educated guess from published dimensions (span 64.75 m (curved sharklet), wheelbase 28.7 m, Trent XWB about 9.9 m out, gear track 10.6 m).
# Origin assumed level with the engine fan like the Fenix model; check with the position markers and save a
# corrected copy with 'New profile for this aircraft'. Effects read the sim's standard N1.
[profile]
name=iniBuilds A350-900
match=A350-900
match=A350 900
match=A359

[globals]
engine_x=-9.9
engine_y=-1.0
engine_z=0.0
main_gear_x=-5.3
main_gear_z=-6.0
nose_gear_z=22.7
ground_y=-3.6
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)

[effect.wingtip_vortex]
offset=32.4 4.2 -17.5

[effect.wingtip_vortex_near]
offset=32.4 4.2 -17.5

[effect.flap_vortex]
offset=21.0 1.8 -11.5

[effect.flap_vortex_near]
offset=21.0 1.8 -11.5

[effect.apu_steam]
offset=0 1.5 -32.0
