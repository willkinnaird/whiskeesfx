# FlyByWire A380: educated guess from published dimensions (span 79.8 m, four engines (inner about 14.6 m out, outer 25.7 m), wing gear track 12.5 m).
# Origin assumed level with the engine fan like the Fenix model; check with the position markers and save a
# corrected copy with 'New profile for this aircraft'. Effects read the sim's standard N1.
[profile]
name=FlyByWire A380
match=A380
match=A380X

[globals]
engine_x=-14.6
engine_y=-1.0
engine_z=0.0
engine_outer_x=-25.7
engine_outer_y=-0.1
engine_outer_z=-4.5
main_gear_x=-6.2
main_gear_z=-8.0
nose_gear_z=22.4
ground_y=-4.6
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)
(L:A320_Sound:ENG_1_N1, Number) => (A:TURB ENG N1:1, Percent)

[effect.wingtip_vortex]
offset=39.9 4.4 -21.5

[effect.wingtip_vortex_near]
offset=39.9 4.4 -21.5

[effect.flap_vortex]
offset=30.0 2.0 -15.0

[effect.flap_vortex_near]
offset=30.0 2.0 -15.0

[effect.apu_steam]
offset=0 2.5 -40.0
