# PMDG 777F / 777-200LR: educated guess from published dimensions (span 64.8 m, wheelbase 25.9 m, GE90-110B/115B, gear track 11.0 m).
# Origin assumed level with the engine fan like the Fenix model; check with the position markers and save a
# corrected copy with 'New profile for this aircraft'. Effects read the sim's standard N1.
[profile]
name=PMDG 777F / 777-200LR
match=PMDG & 777F
match=PMDG & 777-200
match=777F
match=777-200LR

[globals]
engine_x=-9.75
engine_y=-1.2
engine_z=0.0
main_gear_x=-5.5
main_gear_z=-6.5
nose_gear_z=19.4
ground_y=-3.6
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)

[effect.wingtip_vortex]
offset=32.4 3.4 -18.0

[effect.wingtip_vortex_near]
offset=32.4 3.4 -18.0

[effect.flap_vortex]
offset=20.0 1.9 -12.0

[effect.flap_vortex_near]
offset=20.0 1.9 -12.0

[effect.apu_steam]
offset=0 1.5 -29.5
