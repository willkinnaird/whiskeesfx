# iFly 737 MAX 8: educated guess from published dimensions (as the 737-800, LEAP-1B hung further forward and higher; split-tip winglet).
# Origin assumed level with the engine fan like the Fenix model; check with the position markers and save a
# corrected copy with 'New profile for this aircraft'. Effects read the sim's standard N1.
[profile]
name=iFly 737 MAX 8
match=iFly & MAX
match=iFly & 737-MAX
match=737-MAX8
match=MAX8200
match=iFly & 737MAX
match=737 MAX 8
match=737-8200

[globals]
engine_x=-4.9
engine_y=-1.25
engine_z=0.35
main_gear_x=-2.86
main_gear_z=-4.2
nose_gear_z=11.4
ground_y=-2.6
var6=TURB ENG N1:1, Percent

[replace]
(L:A320_Sound:ENG_{e}_N1, Number) => (A:TURB ENG N1:{e}, Percent)
(L:A320_Sound:ENG_1_N1, Number) => (A:TURB ENG N1:1, Percent)

[effect.wingtip_vortex]
offset=17.95 2.9 -9.2

[effect.wingtip_vortex_near]
offset=17.95 2.9 -9.2

[effect.flap_vortex]
offset=12.8 0.9 -6.5

[effect.flap_vortex_near]
offset=12.8 0.9 -6.5

[effect.apu_steam]
offset=0 1.0 -19.5
