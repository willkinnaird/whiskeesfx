# Fenix A320, CFM56 engines, wingtip fences.
# v0.2 positions: copied from Whiskee's A321 CFM sharklets v0.2 (engines, main gear, wing, flaps). Nose gear and APU: A321 minus the fuselage plugs.
# IAE: the V2500's longer intake and long-duct nozzle move the intake effects 0.35 m forward and the exhaust ones 0.6 m back (a guess).
# Check with the markers and save a corrected copy with 'New profile for this aircraft'.
[profile]
name=Fenix A320 · CFM · fences
type=Fenix A320
official=1
version=0.2
match=FenixA320 & CFM & !SL
match=Fenix A320 & CFM & !SL
changes=v0.2: Positions from the A321 CFM sharklets v0.2 (educated guess, not yet checked in the sim)

