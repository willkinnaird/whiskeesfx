# Fenix A321, CFM56 engines, sharklets.
# Nose gear and APU: measured with markers 19 Nov. Engines, main gear and wings are the same on all three.
# IAE: the V2500's longer intake and long-duct nozzle move the intake effects 0.35 m forward and the exhaust ones 0.6 m back (a guess).
# Check with the markers and save a corrected copy with 'New profile for this aircraft'.
[profile]
name=Fenix A321 · CFM · sharklets
type=Fenix A321
# Whiskee official: tuned and checked in the sim by Whiskee. Read-only in the app; users make their own copy.
official=1
version=0.2
note=Positions: Nose gear, APU, main gear and ground measured with test dots in the sim.
note=Wet reverse: Fast spray through the main gear and out the far side, sporadic bursts over the wing.
note=Intake fog: Sits inside the engine and switches on and off with the power.
note=Vortices: One beaded rope from each wingtip; flap vortices toned down.
match=FenixA321 & CFM & SL
match=Fenix A321 & CFM & SL
# Liveries whose name doesn't say the engine or tips get this one
match=FenixA321
match=Fenix A321
changes=v0.2: New positions

