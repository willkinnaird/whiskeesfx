param=gm_dir_z (A:GROUND VELOCITY, knots) 0.45 * 24 + -1 *
param=gm_jitter 3
param=gm_spread_x 0.6
param=gm_spread_y 0.1
param=gm_spread_z 0.6
param=gm_gravity 9.8
param=gm_drag 0.5
