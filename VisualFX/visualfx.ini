# NEW: anti-icing fluid shedding off the wing on the take-off roll. Real world (NASA icing guide, Aalto/Trafi
# wind-tunnel tests): Type II/IV fluid stays on while taxiing and shears off the wing as speed builds, mostly gone
# by rotation (100-110 kt). Assumes you were de-iced when it's freezing (v1<1) and rain or snow is falling (v8>2.5).
[effect.deice_fluid_shed]
# De-icing fluid streaming off the trailing edge as liquid (droplets), luminous yellow half.
preset=drops
at=sides
offset=9.0 1.0 -5.4
when=ground v1<1 gs>35
param=gm_dir_y -0.5
param=gm_dir_z (A:GROUND VELOCITY, knots) 35 - 0 max 0.5 * 0.5 + -1 *
param=gm_jitter 0.3
param=gm_spread_x 5.0
param=gm_spread_y 0.03
param=gm_spread_z 0.2
param=gm_gravity 3
