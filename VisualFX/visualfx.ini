# WhiskeesFX VisualFX settings, v12 (19 Nov 2026). Changes are picked up within 2 seconds while the sim runs.
#
# EVERY effect is now a WhiskeesFX custom effect with live dials (no Asobo effects left switched on).
#   WFX_Mist     {4D2A7C10-8E35-4B61-9F02-6A1C3E5B7D81}  moves with the aircraft: spray, steam, vapour, condensation
#   WFX_Trail    {7B3E1F42-2C9D-4A70-8E51-0D4F6A2B9C13}  stays where it was made: wheel spray, vortices, smoke, drips
#   WFX_Droplets {A61C5E93-4F27-4D08-B3E6-91B2D7C40F55}  heavier water droplets (splash texture)
#   WFX_HeatHaze {E2B94D17-6A3C-4F85-9D10-3C7E5A8B2F69}  heat shimmer (experimental)
#   WingWater    {FCE98D79-8557-4515-B3D5-B3389E95C39E}  water over the wing in reverse (ww_speed/length/width/thick/blue)
#
# IF THE NEW EFFECTS DON'T APPEAR (status.txt says "spawn FAILED"): change the three guid lines in
# [preset.mist], [preset.trail] and [preset.drops] to the "Safe" twins (same dials, fewer node types):
#   WFX_MistSafe {5E8B2D31-9C46-4A17-8F63-2B7D0E4C1A92}  WFX_TrailSafe {8C4F2A53-3D1E-4B81-9A62-1E5B7C3D0F24}
#   WFX_DropletsSafe {B72D6F04-5A38-4E19-C4F7-02C3E8D51A66}
# and if those fail too, to the old GenericMist {6A1E0C3B-2F4D-4E8A-9B7C-5D3E1F0A9C21} / GenericTrail
# {9C4B7E21-6D3A-4F1B-8E2C-7A5D0B3F1E64}. The pre-v12 file is kept as visualfx_before_v12.ini.
#
# KEYS in an [effect.name] section:
#   preset = NAME     pull in a [preset.NAME] section (presets must be above). The effect's own lines always win.
#   guid, at (ref engines inner_engines outer_engines mains nose wheels sides), offset x y z, rotate p b h (degrees),
#   when (wet dry raining humid ground air touchdown always never, n1> reverser> gs> ias> agl< wetness> v1..v8),
#   on (1/0), restart = N (after switching off, let it fade N s and start fresh next time: for bursts),
#   param = NAME RPN   ({e} = engine number, {i} = inboard sign: +1 left side, -1 right side).
# Axes: x sideways (+ = aircraft LEFT; with {i} + = inboard), y up, z forward (negative = behind).
#
# DIALS of WFX_Mist / WFX_Trail / WFX_Droplets (all live, any RPN expression):
#   start box      gm_spread_x/y/z (m, half size)
#   movement       gm_dir_x/y/z (m/s), gm_jitter (+- m/s random), gm_speed (m/s along a cone) aimed by gm_pitch and
#                  gm_heading (deg), cone half-angles gm_cone / gm_cone_in (deg)
#                  gm_gravity (m/s2 down, negative rises), gm_drag (slow-down per s), gm_wind (0..1 drift with wind)
#                  gm_swirl (corkscrew m/s), gm_swirl_rate (rad/s), gm_swirl_up (0 fore-aft axis, 1 vertical axis)
#   size           gm_size (m), gm_size_min (0..1), gm_grow (x 1+grow over life), gm_grow_curve (1 even, .5 smoke-like)
#   life           gm_life (s), gm_life_min (0..1)
#   opacity        gm_alpha (peak), gm_shape (0 = soft peak mid-life [the old look], 1 = fade in, hold, fade out),
#                  gm_fade_in / gm_fade_out (share of life, used when gm_shape is 1)
#   colour         gm_grey (1 white), gm_r / gm_g / gm_b (0..1), gm_blue (0..1 blue tint), gm_glow (self-lit)
#   spin           gm_spin (random spin either way)
#   amount         gm_rate (particles/s), gm_burst (extra particles/s when it starts), gm_burst_time (s)
# Heat haze dials: hh_strength, hh_speed, hh_blur, hh_scale, hh_pitch/bank/heading, hh_x/y/z.
#
# Colour rule (Whiskee): watery effects gm_blue 0.06 (slight), vapour/condensation gm_grey 0.88 (light grey).
# The "Real world" notes say when each effect shows up and when it's strongest (sources in RESEARCH.md).
enabled=1

# --- Runway water ---------------------------------------------------------------
# VisualFX keeps its own idea of how wet the runway is, so spray continues after MSFS
# dries the runway. Builds while it rains, then dries over dry_minutes.
rain_counts_as_wet=1
wet_build_minutes=3
dry_minutes=10
wet_threshold=0.15
# Spray strength follows how wet the runway is (module v13+, L:WFX_WET_CUT): a just-damp runway gives wet_scale_min
# of the spray, full strength from wet_full runway water up. Loading into rain assumes wet_start.
wet_scale_min=0.3
wet_full=0.7
wet_start=0.5

# --- Aircraft geometry (Fenix A321) ------------------------------------------------
engine_x=-5.75   # negative: in MSFS coordinates +x is the left side
engine_y=-1.6
engine_z=0.0
main_gear_x=-3.8
main_gear_z=-3.9   # measured with markers 19 Nov (was -1.0)
nose_gear_z=12.9   # moved back 3 m with markers 19 Nov (was 15.9)
ground_y=-2.9   # measured with the marker 19 Nov (was -3.4)
touchdown_seconds=1.5
angle_scale=0.0174533   # rotate is in degrees

# Humid: MSFS has no humidity value, so rain, snow, cloud or visibility below humid_visibility (m) count as humid.
# humid_force = -1 works it out, 1 = always humid, 0 = never.
humid_visibility=3000
humid_force=-1

# --- Your own sim variables for conditions (v1>.., v2<..) -------------------------------
var1=AMBIENT TEMPERATURE, Celsius
var2=AMBIENT VISIBILITY, Meters
var3=FLAPS HANDLE INDEX, Number
var4=VERTICAL SPEED, Feet per minute
var5=BRAKE LEFT TEMPERATURE, Celsius   # MSFS 2024 brake temperature (any aircraft); brake heat effects
# Fenix: the sim's own N1 lags and stays at idle in reverse, so effects use the Fenix's real N1 (engine 1).
var6=L:A320_Sound:ENG_1_N1, Number
var7=SURFACE CONDITION, Number   # 0 normal, 1 wet, 2 icy, 3 snow
var8=AMBIENT PRECIP STATE, Number   # 2 none, 4 rain, 8 snow
lvar_search =

# =====================================================================================
# PRESETS
# =====================================================================================

# Every dial with its neutral value. With these, WFX_Mist looks exactly like the old GenericMist.
[preset.mist]
# Only the guid: each effect sends just the dials it sets (the sim ignores ALL dials if an effect gets too many).
guid={4D2A7C10-8E35-4B61-9F02-6A1C3E5B7D81}

[preset.trail]
preset=mist
guid={7B3E1F42-2C9D-4A70-8E51-0D4F6A2B9C13}

[preset.drops]
preset=mist
guid={A61C5E93-4F27-4D08-B3E6-91B2D7C40F55}

# Runway spray cloud (replaces Asobo's wet engine blast {27ED6022}): a low, wide, rolling cloud that
# billows out, slows down and fades. Blows aft (-z) like Asobo's did; layers turned with `rotate` blow forward.
# Thickness follows the Fenix's real N1 (idle reverse ~32, max ~69).
[preset.wetblast]
# 20 Nov late: "a lot quicker" -> about twice the speed and churn, shorter life, more drag so it bursts out
# then hangs (before: dir_y 1.2, dir_z -9, jitter 3, drag 0.8, grow 1.8, life 2.0, rate 80; visualfx_before_fast_reverse.ini).
preset=mist
param=gm_dir_y 1.8
param=gm_dir_z -18
param=gm_jitter 6
param=gm_spread_x 1.2
param=gm_spread_y 0.25
param=gm_spread_z 1.0
param=gm_drag 1.6
param=gm_size 1.8
param=gm_grow 2.2
param=gm_life 1.2
param=gm_alpha (L:A320_Sound:ENG_{e}_N1, Number) 25 - 45 / 0.3 max 1 min 0.085 * 1 (L:WFX_WET_CUT, Number) - *
param=gm_grey 0.98
param=gm_blue 0.06
param=gm_rate 120

# Lighter, quicker wisps (replaces Asobo's wet-grass kick {78429911}, minus the brown clumps it threw at speed).
[preset.wetkick]
preset=mist
param=gm_dir_y 1.5
param=gm_dir_z -6
param=gm_jitter 2.5
param=gm_spread_x 0.8
param=gm_spread_z 0.8
param=gm_size 0.9
param=gm_grow 1.5
param=gm_alpha 0.06 1 (L:WFX_WET_CUT, Number) - *
param=gm_blue 0.06
param=gm_rate 70

# Snow versions: white, bigger, slower, longer, settling a little (replaces Asobo's snow blast {FE43D145}).
[preset.snowblast]
preset=wetblast
param=gm_size 2.4
param=gm_life 2.8
param=gm_drag 0.6
param=gm_alpha (L:A320_Sound:ENG_{e}_N1, Number) 25 - 45 / 0.3 max 1 min 0.11 *

[preset.snowkick]
preset=wetkick
param=gm_gravity 0.3
param=gm_alpha 0.08

# Wing and flap vortex threads. Real world (FAA AC 90-23G / AIM 7-4, NASA wake studies; see RESEARCH.md):
#  - strongest on take-off and approach (high lift, slow, flaps out), visible only in humid air
#  - the condensed core is a corkscrew (helical) thread, not a straight line, and it wanders
#  - the pair sinks a few hundred ft/min (A321 about 1.8 m/s) and drifts with the wind (they move with the air)
#  - within about a wingspan of the ground the sinking stops and they spread outward at 2-3 kt
#  - tip vortices roll up slightly inboard; the flap vortex winds towards the tip vortex and merges with it
# How: helix = sin/cos of time at 25 rad/s (about a 17 m twist at 135 kt), slow meander sines, roll-up drift
# ({i} = inboard), sinking that turns into outward spread below ~120 ft AGL, gm_wind 1, gm_drag 0.4.
# Bright short root so the thread is visible right at the wing / flap.
[preset.vortex]
# 20 Nov late (user's close-up: "stacked circles, a hollow trail"): the rope is beaded, swelling and thinning every
# few metres. gm_size now pulses at ~8 Hz (+-30%, plus a 5 Hz wobble) so the beads are laid along the rope as it's
# emitted (dials go out every frame). The true hollow look needs a ring texture (custom material, Dev Mode session).
# Standalone: at most 16 dials per effect (the sim ignores them all beyond that). 16 used.
# 20 Nov draft from the Emirates 777 wake video (frames checked): the trail stays ONE continuous rope the whole way,
# thin at the tip, slowly thickening, snaking in big smooth waves and coiling into loops as it ages, and it hangs
# in the air for 10+ s. So: no per-particle scatter (that makes puffs); the chaos comes from coherent motion
# (the waving emission plus a slow corkscrew), growth and wind. Before: size 0.17, jitter 0.04, grow 1.2, wind 0.3, alpha x0.35, no swirl (visualfx_before_tube.ini).
guid={7B3E1F42-2C9D-4A70-8E51-0D4F6A2B9C13}
param=gm_size (E:ABSOLUTE TIME, Seconds) 50 * {i} + sin 0.45 * (E:ABSOLUTE TIME, Seconds) 31 * sin 0.15 * + 1 + 0.15 *
param=gm_life 9
param=gm_alpha (A:G FORCE, GForce) 1.02 - 6 * (A:ELEVATOR DEFLECTION, Radians) abs 8 * + (A:AILERON AVERAGE DEFLECTION, Radians) abs 6 * + (A:AIRSPEED INDICATED, Knots) 90 - 80 / 0 max 0.5 min + 0 max 1 min 0.3 *
param=gm_rate 1500
param=gm_dir_x (E:ABSOLUTE TIME, Seconds) 25 * sin 0.08 * {i} * (E:ABSOLUTE TIME, Seconds) {i} 3 * + 0.35 * sin 0.8 * + {i} 1.2 * + (A:PLANE ALT ABOVE GROUND, Feet) 40 - 80 / 0 max 1 min -1 * 1 + {i} 1.3 * * -
param=gm_dir_y (E:ABSOLUTE TIME, Seconds) 25 * cos 0.08 * (E:ABSOLUTE TIME, Seconds) {i} 2 * + 0.5 * sin 0.6 * + (A:PLANE ALT ABOVE GROUND, Feet) 40 - 80 / 0 max 1 min -2.8 * + -0.6 +
param=gm_jitter 0.03
param=gm_spread_x 0
param=gm_spread_y 0
param=gm_spread_z 0.2
param=gm_grow 3
param=gm_grey 0.6
param=gm_wind 0.5
param=gm_swirl 0.7
param=gm_swirl_rate 1.4
param=gm_grow_curve 0.5

[preset.vortex_ring]
# 21 Nov (take 3): every particle is a RING (our own material WFX_Ring, texture VisualFX/textures/WFX_Ring.png,
# effect WFX_RingTex). Particles face the camera, so a dense line of rings = stacked circles / hollow tube.
# Size pulses a little for the beads. Needs the effects package built in Dev Mode (1.2.0, with the material lib).
guid={F1C7A3D8-2B64-4E95-9A30-6D8E2F1B5C07}
param=gm_size (E:ABSOLUTE TIME, Seconds) 50 * {i} + sin 0.25 * 1 + 0.15 *
param=gm_size_min 1
param=gm_life 12
param=gm_alpha (A:AIRSPEED INDICATED, Knots) 90 - 60 / 0 max 1 min 0.5 *
param=gm_rate 150
param=gm_dir_x (E:ABSOLUTE TIME, Seconds) 25 * sin 0.08 * {i} * (E:ABSOLUTE TIME, Seconds) {i} 3 * + 0.35 * sin 0.8 * + {i} 1.2 * + (A:PLANE ALT ABOVE GROUND, Feet) 40 - 80 / 0 max 1 min -1 * 1 + {i} 1.3 * * -
param=gm_dir_y (E:ABSOLUTE TIME, Seconds) 25 * cos 0.08 * (E:ABSOLUTE TIME, Seconds) {i} 2 * + 0.5 * sin 0.6 * + (A:PLANE ALT ABOVE GROUND, Feet) 40 - 80 / 0 max 1 min -2.8 * + -0.6 +
param=gm_jitter 0.02
param=gm_spread_x 0
param=gm_spread_y 0
param=gm_spread_z 0.1
param=gm_grow 9
param=gm_grey 0.85
param=gm_wind 1
param=gm_swirl 0.5
param=gm_swirl_rate 1.4

[preset.vortex_ring_near]
# The thin bright tube right behind the tip: small tight rings, short life, kinked from the start.
preset=vortex_ring
param=gm_dir_y (E:ABSOLUTE TIME, Seconds) 25 * cos 0.08 * (E:ABSOLUTE TIME, Seconds) {i} 2 * + 1.3 * sin 0.15 * +
param=gm_size (E:ABSOLUTE TIME, Seconds) 50 * {i} + sin 0.25 * 1 + 0.12 *
param=gm_life 1.1
param=gm_alpha (A:AIRSPEED INDICATED, Knots) 90 - 60 / 0 max 1 min 0.7 *
param=gm_grow 1
param=gm_swirl 0
param=gm_grey 0.95

[preset.vortex_near]
# The tube: dense, narrow, steady and smooth for the first ~1 s behind the tip (before: life 0.35, jitter 0.1, grow 1).
preset=vortex
# Kinked from the start (close-up: the rope is already lumpy right behind the winglet; was dir_y 0).
param=gm_dir_y (E:ABSOLUTE TIME, Seconds) 25 * cos 0.08 * (E:ABSOLUTE TIME, Seconds) {i} 2 * + 1.3 * sin 0.15 * +
param=gm_life 1.1
param=gm_alpha (A:G FORCE, GForce) 1.02 - 6 * (A:ELEVATOR DEFLECTION, Radians) abs 8 * + (A:AILERON AVERAGE DEFLECTION, Radians) abs 6 * + (A:AIRSPEED INDICATED, Knots) 90 - 80 / 0 max 0.5 min + 0 max 1 min 0.5 *
param=gm_rate 1500
param=gm_jitter 0.01
param=gm_spread_z 0.3
param=gm_grow 0.3
param=gm_swirl 0
param=gm_size (E:ABSOLUTE TIME, Seconds) 50 * {i} + sin 0.45 * (E:ABSOLUTE TIME, Seconds) 31 * sin 0.15 * + 1 + 0.11 *
param=gm_grey 0.85

# Over-wing vapour sheet. Real world: angle of attack + humid air; flashes at rotation and in the flare.
[preset.vapour]
# 20 Nov draft (777 video): on approach the vapour is a white sheet over most of the upper wing, thicker and faster
# than ours, flickering; each wing on its own (before: dir_z -40, size 0.9, spread_z 0.6).
preset=mist
param=gm_dir_y 6
param=gm_dir_z -40
param=gm_jitter 0.2
param=gm_spread_x 0.4
param=gm_spread_y 0.1
# 23 Nov: ragged front line - puffs born a little ahead/behind the edge (was 0.3)
param=gm_spread_z 0.12
param=gm_grow 0.8
param=gm_size 1.1
param=gm_life 0.08
param=gm_rate 1500
# 21 Nov: so thick on the leading edge you can't see the wing (user's photo), thinning fast as it streams back:
# full strength at birth fading to nothing over a short life (~4 m of travel), small puffs hugging the surface,
# a slight upward drift so it doesn't spill under the wing.
param=gm_shape 1
param=gm_fade_in 0.4
param=gm_fade_out 1
# 23 Nov: thicker on the leading edge - no fade-in (the default 15% ramp thinned the very front), more puffs,
# and the per-emitter drift never drops below 60%.
# Ragged, not a comb: each puff gets a random length and size.
param=gm_life_min 0.75
param=gm_size_min 0.8

# Wheel spray / powder thrown behind the wheels, growing from nothing at 10 kt to full at 140 kt.
# 23 Nov (TriTriSim Fenix A321 video): a smooth see-through veil that rises straight up off the leading edge
# and stays on it (softer pass: fewer, fainter puffs, rising less) - big soft overlapping puffs at low strength, not an opaque blanket over the wing.

[preset.wheelspray]
preset=trail
param=gm_dir_y (A:GROUND VELOCITY, knots) 10 - 130 / 0 max 1 min 1.2 * 0.4 +
param=gm_dir_z (A:GROUND VELOCITY, knots) 10 - 130 / 0 max 1 min 8 * 1 +
param=gm_size (A:GROUND VELOCITY, knots) 10 - 130 / 0 max 1 min 1.0 * 0.3 +
param=gm_life 1.2
param=gm_alpha (A:GROUND VELOCITY, knots) 10 - 130 / 0 max 1 min 0.05 * 1 (L:WFX_WET_CUT, Number) - *
param=gm_jitter 4
param=gm_spread_x 0.8
param=gm_spread_y 0.1
param=gm_spread_z 0.8
param=gm_grow 1.0
param=gm_grey 0.75
param=gm_blue 0.06

# Rain drips: water running off in the air after a wet take-off or in rain.
[preset.drips]
preset=trail
param=gm_dir_z -1
param=gm_blue 0.06
param=gm_gravity 4

# =====================================================================================
# RAIN / WET RUNWAY
# =====================================================================================

# Forward-thrust blast on a wet runway (was Asobo wet blast). Real world: water blown up behind the engines at
# high power, strongest at the start of the take-off roll; as speed builds it's left behind. Trail = stays put.
[effect.engine_spray]
preset=wetblast
guid={7B3E1F42-2C9D-4A70-8E51-0D4F6A2B9C13}
at=engines
offset=0 -1.3 -4
when=wet ground n1>30 reverser<5
param=gm_dir_z -14
param=gm_alpha (L:A320_Sound:ENG_{e}_N1, Number) 30 - 55 / 0 max 1 min 0.08 * 1 (L:WFX_WET_CUT, Number) - *
param=gm_rate (L:A320_Sound:ENG_{e}_N1, Number) 30 - 55 / 0 max 1 min 90 * 10 +

# Mist kicked up behind the wheels on wet tarmac (was Asobo tarmac-wet vortex {89294226}): a soft swirl.
[effect.wheel_spray]
# Rebuild of Asobo's tarmac-wet spray (19 Nov): a low ring of spray hugging the bottom of the tyre,
# swirling round it, in the spray colour. Asobo original: guid {89294226-E3A1-4DC6-B9EF-C127B2C2B6EC}, offset 0 0 -3.
preset=mist
at=mains
offset=0 0.15 0
when=wet ground gs>3
param=gm_dir_y 0.4
param=gm_dir_z (A:GROUND VELOCITY, knots) 0.25 * 2 + -1 *
param=gm_jitter 1.2
param=gm_spread_x 0.7
param=gm_spread_y 0.12
param=gm_spread_z 0.6
param=gm_swirl 1.5
param=gm_swirl_up 1
param=gm_drag 0.3
param=gm_size 0.55
param=gm_grow 1.2
param=gm_life (A:GROUND VELOCITY, knots) 140 / 0 max 1 min 0.9 * 0.6 +
param=gm_alpha (A:GROUND VELOCITY, knots) 3 - 40 / 0 max 1 min 0.03 * 1 (L:WFX_WET_CUT, Number) - *
param=gm_grey 0.75
param=gm_blue 0.06
param=gm_rate (A:CONTACT POINT IS ON GROUND:1, Bool) (A:CONTACT POINT IS ON GROUND:2, Bool) max 260 * (E:ABSOLUTE TIME, Seconds) 11 * sin (E:ABSOLUTE TIME, Seconds) 4.7 * sin + 0.5 * 0.5 + 0.75 * 0.25 + *

[effect.wheel_spray_nose]
