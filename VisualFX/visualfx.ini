# ---- 20 Nov late: the core blast spilling into the main gear and out the other side.
# Real world: in reverse the flow that isn't turned forward by the cascades (and the core exhaust) hits the runway
# under the nacelle, races inboard and aft into the main gear, is torn into tight eddies around the legs and
# wheels, and some of it shoots out under the belly on the far side. Very fast, very turbulent.
