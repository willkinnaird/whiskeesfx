# WhiskeesFX VisualFX settings (formerly GroundFeel RainFX). Changes are picked up within 2 seconds while the sim runs.
# Each [effect.name] spawns a sim or WhiskeesFX effect by guid. Keys: at, offset x y z, rotate p b h, when, on, param name RPN.
# Custom effects: WingWater {FCE98D79}, GenericMist {6A1E0C3B} (moves with the aircraft), GenericTrail {9C4B7E21} (left in the air),
# GenericRibbon {3D8F2A61}. Generic dials: gm_dir_x/y/z, gm_jitter, gm_spread_x/y/z, gm_size, gm_life, gm_alpha, gm_rate, gm_grow,
# gm_grey (1 white .. lower grey), gm_blue (0..1 tint). Axes: x sideways ({i} = inboard sign), y up, z forward.
enabled=1

# --- Runway water ---------------------------------------------------------------
# VisualFX keeps its own idea of how wet the runway is, so spray continues after MSFS
# dries the runway. Builds while it rains, then dries over dry_minutes.
rain_counts_as_wet=1
wet_build_minutes=3
dry_minutes=30
wet_threshold=0.15

# --- Aircraft geometry (Fenix A321) ------------------------------------------------
# Metres from the aircraft's reference point. x = sideways (mirrored left/right),
# y = up, z = forward (negative = behind).
engine_x=-5.75   # negative: in MSFS coordinates +x is the left side
engine_y=-1.6
engine_z=0.0
main_gear_x=-3.8
main_gear_z=-1.0
nose_gear_z=15.9
ground_y=-3.4
touchdown_seconds=1.5
# If rotate doesn't seem to turn things the way you expect, try angle_scale = 0.0174533 (radians).
angle_scale=0.0174533

# Humid: MSFS has no humidity value, so rain, cloud or visibility below humid_visibility (m) count as humid.
# humid_force = -1 works it out, 1 = always humid, 0 = never.
humid_visibility=3000
humid_force=-1
# Four-engine aircraft only: outer engine position (A380 example, commented out).
# engine_outer_x = -25.6
# engine_outer_y = -1.0
# engine_outer_z = -6.0

# --- Your own sim variables for conditions (v1>.., v2<..) -------------------------------
var1=AMBIENT TEMPERATURE, Celsius
var2=AMBIENT VISIBILITY, Meters
var3=FLAPS HANDLE INDEX, Number
var4=VERTICAL SPEED, Feet per minute
var5=BRAKE LEFT POSITION, Percent
# Fenix: the sim's own N1 stays at idle in reverse, so reverse layers use the Fenix's real N1 (engine 1).
var6=L:A320_Sound:ENG_1_N1, Number
var7=SURFACE CONDITION, Number   # 0 normal, 1 wet, 2 icy, 3 snow
var8=AMBIENT PRECIP STATE, Number   # 2 none, 4 rain, 8 snow

# Lists the aircraft's own L:vars containing these words in status.txt (blank = off).
# Use them as var1..var8 with an L: prefix, e.g. var6 = L:SOME_NAME, Number
lvar_search =

# --- Per-aircraft settings -----------------------------------------------------------
# [aircraft.TEXT] applies the following lines when the aircraft title contains TEXT.
# Put these after the general settings. The title in use is shown in status.txt.
# [aircraft.A380]
# engine_x = -15.0

